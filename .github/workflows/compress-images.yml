name: Compress images

# Editors upload straight from a phone or camera, so this fixes whatever
# lands rather than asking them to prepare files first.
#
# It runs overnight rather than on push, and that is not a cosmetic choice.
# Keystatic saves with an expectedHeadOid; when the branch has moved it
# quietly retries, but only if the files behind the open entry are untouched.
# Rewriting an image the editor just uploaded is precisely the case it
# refuses, answering with "This entry has been updated since it was opened.
# Create a new branch to save changes." On push this job landed 27 seconds
# after each save, so every follow-up edit to that entry demanded a branch.
#
# Overnight nobody has the admin open, so the rewrite is invisible. The cost
# is that an oversized upload sits on the edge until the next run, which
# changes nothing for visitors: next/image already serves a resized copy.
on:
  schedule:
    # 16:00 UTC — about 2am in Sydney, either side of daylight saving.
    - cron: "0 16 * * *"
  workflow_dispatch:

# The job commits the shrunken files back to the branch it ran on.
permissions:
  contents: write

# Stops a manual run racing the scheduled one.
concurrency:
  group: compress-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: node scripts/compress-images.mjs

      - name: Commit the results
        # Branch names reach the shell as an env var, never interpolated into
        # the script, so a name containing shell metacharacters can't run.
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to compress."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Compress uploaded images

          Automated. Resizes anything over 2400px and converts photos saved as
          PNG to JPEG, repointing content/ at the new paths. See
          scripts/compress-images.mjs."

          # Another save may have landed while this ran.
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"

          # Deliberately no [skip ci]: when a file is renamed, the deployed
          # site still points at the old path until this commit ships.
